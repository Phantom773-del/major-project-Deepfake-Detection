services:
  postgres:
    image: postgres:16-alpine
    container_name: phantom_postgres
    environment:
      POSTGRES_USER: phantom
      POSTGRES_PASSWORD: phantom
      POSTGRES_DB: phantom
    ports:
      - "5432:5432"
    volumes:
      - phantom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantom -d phantom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  phantom_pgdata:
